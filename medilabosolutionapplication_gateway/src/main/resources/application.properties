spring.application.name=medilabosolutionapplication-gateway

server.port=8080

logging.level.org.springframework.cloud.gateway=DEBUG

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=medilabosolutionapplication-patient
spring.cloud.gateway.routes[0].uri=http://localhost:8081/
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**

spring.cloud.gateway.routes[1].id=medilabosolutionapplication-notes
spring.cloud.gateway.routes[1].uri=http://localhost:8083/
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/notes/**

spring.cloud.gateway.routes[2].id=medilabosolutionapplication-risk
spring.cloud.gateway.routes[2].uri=http://localhost:8084/
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/risk/**

spring.cloud.gateway.routes[3].id=medilabosolutionapplication-front
spring.cloud.gateway.routes[3].uri=http://localhost:8082/
spring.cloud.gateway.routes[3].predicates[0]=Path=/login
spring.cloud.gateway.routes[3].predicates[1]=Path=/patient/**
spring.cloud.gateway.routes[3].predicates[2]=Path=/risk/**
spring.cloud.gateway.routes[3].predicates[3]=Path=/notes/**

spring.cloud.gateway.routes[2].id=medilabosolutionapplication-security
spring.cloud.gateway.routes[2].uri=http://localhost:8087/
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/**

security.service.url=http://localhost:8087/