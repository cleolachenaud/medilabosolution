opencollection: 1.0.0
info:
  name: openclassroom
config:
  environments:
    - name: production
      variables:
        - name: portGateway
          value: '8080'
        - name: portPatient
          value: '8080'
    - name: test
      variables:
        - name: portGateway
          value: '8082'
        - name: portPatient
          value: '8083'
items:
  - info:
      name: medilabosolution
      type: folder
      seq: 2
    request:
      auth: inherit
    items:
      - info:
          name: Tests (asserts)
          type: folder
          seq: 2
        request:
          auth: inherit
          variables:
            - name: urlGateway
              value: http://localhost:8080/
        items:
          - info:
              name: Front
              type: folder
              seq: 2
            request:
              auth: inherit
            items:
              - info:
                  name: FRONT - avec token
                  type: http
                  seq: 2
                http:
                  method: GET
                  url: http://localhost:8080/
                  auth:
                    type: bearer
                    token: '{{tokenPourTest}}'
                runtime:
                  assertions:
                    - expression: res.status
                      operator: eq
                      value: '200'
                    - expression: res.body
                      operator: contains
                      value: <title>Accueil</title>
                    - expression: res.body
                      operator: contains
                      value: <h1>MediLaboSolution Patient</h1>
                settings:
                  encodeUrl: true
                  timeout: 0
                  followRedirects: true
                  maxRedirects: 5
              - info:
                  name: FRONT - sans token
                  type: http
                  seq: 1
                http:
                  method: GET
                  url: http://localhost:8080/
                runtime:
                  assertions:
                    - expression: res.status
                      operator: eq
                      value: '200'
                    - expression: res.body
                      operator: contains
                      value: <h1>Login Medilabosolution</h1>
                    - expression: res.body
                      operator: contains
                      value: <title>Login</title>
                settings:
                  encodeUrl: true
                  timeout: 0
                  followRedirects: true
                  maxRedirects: 5
          - info:
              name: Security
              type: folder
              seq: 1
            request:
              auth: inherit
            items:
              - info:
                  name: SECURITY - getJwt Unauthorized
                  type: http
                  seq: 1
                http:
                  method: POST
                  url: http://localhost:8087/auth/login
                  body:
                    type: json
                    data: |-
                      {
                        "username": "unknown",
                        "password": "user"
                      }
                  auth: inherit
                runtime:
                  assertions:
                    - expression: res.status
                      operator: eq
                      value: '401'
                settings:
                  encodeUrl: true
                  timeout: 0
                  followRedirects: true
                  maxRedirects: 5
              - info:
                  name: SECURITY - getJwt
                  type: http
                  seq: 2
                http:
                  method: POST
                  url: http://localhost:8087/auth/login
                  body:
                    type: json
                    data: |-
                      {
                        "username": "user",
                        "password": "user"
                      }
                  auth: inherit
                runtime:
                  assertions:
                    - expression: res.status
                      operator: eq
                      value: '200'
                  actions:
                    - type: set-variable
                      phase: after-response
                      selector:
                        expression: res.body.access_token
                        method: jsonq
                      variable:
                        name: tokenPourTest
                        scope: runtime
                settings:
                  encodeUrl: true
                  timeout: 0
                  followRedirects: true
                  maxRedirects: 5
          - info:
              name: Patient TestNone
              type: folder
              seq: 3
            request:
              auth: inherit
              variables:
                - name: nomPatient
                  value: TestNone
                - name: prenomPatient
                  value: Test
            items:
              - info:
                  name: NOTES - avec token
                  type: http
                  seq: 6
                http:
                  method: GET
                  url: http://localhost:8080/api/notes/patient/{{id}}
                  auth:
                    type: bearer
                    token: '{{tokenPourTest}}'
                runtime:
                  assertions:
                    - expression: res.status
                      operator: eq
                      value: '200'
                    - expression: res.headers['content-type']
                      operator: eq
                      value: application/json
                    - expression: res.body
                      operator: isArray
                      value: ''
                    - expression: res.body
                      operator: isNotEmpty
                      value: ''
                settings:
