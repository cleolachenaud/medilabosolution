<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Accueil</title>
    <link rel="stylesheet" href="webjars/bootstrap/4.0.0-2/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="container">
        <h1>MediLaboSolution Patient</h1>

        <!-- Formulaire de recherche -->
        <form th:action="@{/recherche}" method="get" class="mb-4 form-search">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" class="form-control" placeholder="Entrez le nom" required/>
            </div>
            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" class="form-control" placeholder="Entrez le prénom" required/>
            </div>
            <button type="submit" class="btn btn-primary">Rechercher</button>
        </form>
        
        <!-- Message d'alerte -->
        <div th:if="${message != null}" class="alert alert-warning message-alert" th:text="${message}"></div>
        

        <!-- Formulaire création patient -->
        <div th:if="${showCreateForm}" class="section-create">
            <h2>Créer un nouveau patient</h2>
            <form th:action="@{/patients}" method="post" th:object="${patient}" class="mb-4 form-create">
                
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" th:field="*{nom}" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" th:field="*{prenom}" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label for="dateNaissance">Date de Naissance</label>
                    <input type="date" id="dateNaissance" th:field="*{dateNaissance}" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label>Genre</label><br/>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{genre}" id="genreM" value="M" required />
                        <label class="form-check-label" for="genreM">M</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{genre}" id="genreF" value="F" />
                        <label class="form-check-label" for="genreF">F</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="adresse">Adresse</label>
                    <input type="text" id="adresse" th:field="*{adresse}" class="form-control" />
                </div>
                <div class="form-group">
                    <label for="telephone">Téléphone</label>
                    <input type="text" id="telephone" th:field="*{telephone}" class="form-control" />
                </div>
                <button type="submit" class="btn btn-success">Créer le patient</button>
            </form>
        </div>

        <!-- Affichage du patient trouvé + modification possible -->
        <div th:if="${patient != null and showCreateForm == false}" class="section-patient">
            <!-- Affichage des infos si édition non active -->
            <div th:if="${showEditForm == false}" class="patient-info">
                <p><strong>Nom :</strong> <span th:text="${patient.nom}"></span></p>
                <p><strong>Prénom :</strong> <span th:text="${patient.prenom}"></span></p>
                <p><strong>Date de naissance :</strong> <span th:text="${patient.dateNaissance}"></span></p>
                <p><strong>Genre :</strong> <span th:text="${patient.genre}"></span></p>
                <p><strong>Adresse :</strong> <span th:text="${patient.adresse}"></span></p>
                <p><strong>Téléphone :</strong> <span th:text="${patient.telephone}"></span></p>

                <!-- Bouton pour démarrer la modification du patient -->
				<form th:action="@{/patients/modifier/form}" method="get" class="form-modifier">
				    <input type="hidden" name="id" th:value="${patient.id}" />
				    <button type="submit" class="btn btn-warning">Modifier patient</button>
				</form>
				<!-- Bouton pour voir les notes du patient -->
				<form th:action="@{'/notes/patient/'+ ${patient.id}}" method="get" class="form-modifier">
				    <button type="submit" class="btn btn-warning">Voir notes</button>
				</form>
				<!-- Bouton pour afficher le risque diabète -->
				<form th:if="${risk == null}" th:action="@{'/risk/patient/'+ ${patient.id}}" method="get" class="form-modifier" style="display:inline-block; margin-left: 5px;">
				    <button type="submit" class="btn btn-info">Afficher risque diabète</button>
				</form>
				
				<!-- Affichage conditionnel du risque diabète -->
				<div th:if="${risk != null}" class="mt-3 alert alert-info">
				    <h5>Risque de diabète :</h5> <span th:text="${niveauRiskLisible}"
              th:classappend="
                ${risk.niveauRisk == 'DANGER'} ? 'text-danger' :
                (${risk.niveauRisk == 'RISQUE_LIMITE'} ? 'text-danger' :
                (${risk.niveauRisk == 'AUCUN_RISQUE'} ? 'text-success' : ''))">
        </span>
        		</div>
            </div>
         

            <!-- Formulaire de modification si showEditForm = true -->
            <div th:if="${showEditForm == true}" class="section-edit">
                <h2>Modifier le patient</h2>
                <form th:action="@{'/patients/' + ${patient.id}}" method="post" th:object="${patient}" class="form-edit">
                    <input type="hidden" th:field="*{id}"/>

                    <div class="form-group">
                        <label for="nomModif">Nom</label>
                        <input type="text" id="nomModif" th:field="*{nom}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label for="prenomModif">Prénom</label>
                        <input type="text" id="prenomModif" th:field="*{prenom}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label for="dateNaissanceModif">Date de Naissance</label>
                        <span th:text="${patient.dateNaissance}"></span>
                        <input type="date" id="dateNaissanceModif" th:field="*{dateNaissance}" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label>Genre</label><br/>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{genre}" id="genreMModif" value="M" required />
                            <label class="form-check-label" for="genreMModif">M</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{genre}" id="genreFModif" value="F" required/>
                            <label class="form-check-label" for="genreFModif">F</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="adresseModif">Adresse</label>
                        <input type="text" id="adresseModif" th:field="*{adresse}" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label for="telephoneModif">Téléphone</label>
                        <input type="text" id="telephoneModif" th:field="*{telephone}" class="form-control" />
                    </div>
                    <button type="submit" class="btn btn-success">Enregistrer les modifications</button>
                </form>
            </div>
    	</div>
   	</div>
    <script src="webjars/bootstrap/4.0.0-2/js/bootstrap.min.js"></script>
</body>
</html>
