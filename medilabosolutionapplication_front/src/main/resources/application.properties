spring.application.name=medilabosolutionapplication-front

server.port=8082

# FeignClients
#spring.cloud.openfeign.client.medilabosolutionapplicationrisk.url=http://localhost:8080
#spring.cloud.openfeign.client.medilabosolutionapplicationpatient.url=http://localhost:8080
#spring.cloud.openfeign.client.medilabosolutionapplicationnotes.url=http://localhost:8080
spring.cloud.openfeign.client.gateway.url=http://localhost:8080

# Utilise X-Forwarded-Host (envoyé par la Gateway) pour construire les URLs de redirect
server.forward-headers-strategy=framework


log4j.rootLogger=debug, Stdout
log4j.appender.Stdout=org.apache.log4j.ConsoleAppender
log4j.appender.Stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.Stdout.threshold=debug

logging.level.org.springframework.web.client.RestTemplate=DEBUG