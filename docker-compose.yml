
volumes:
  postgres_data:
    driver: local
    
services:
    gateway:
        build: ./medilabosolutionapplication_gateway
        ports:
            - "8080:8080"
        networks:
            - medilabosolution
        environment:
            SPRING_CLOUD_GATEWAY_ROUTES[0]_ID: medilabosolutionapplication-patient
            SPRING_CLOUD_GATEWAY_ROUTES[0]_URI: http://patient:8081/
            SPRING_CLOUD_GATEWAY_ROUTES[0]_PREDICATES[0]: Path=/api/patients/**
            SPRING_CLOUD_GATEWAY_ROUTES[1]_ID: medilabosolutionapplication-notes
            SPRING_CLOUD_GATEWAY_ROUTES[1]_URI: http://notes:8083/
            SPRING_CLOUD_GATEWAY_ROUTES[1]_PREDICATES[0]: Path=/api/notes/**
            SPRING_CLOUD_GATEWAY_ROUTES[2]_ID: medilabosolutionapplication-risk
            SPRING_CLOUD_GATEWAY_ROUTES[2]_URI: http://risk:8084/
            SPRING_CLOUD_GATEWAY_ROUTES[2]_PREDICATES[0]: Path=/api/risk/**
            SPRING_CLOUD_GATEWAY_ROUTES[3]_ID: medilabosolutionapplication-front
            SPRING_CLOUD_GATEWAY_ROUTES[3]_URI: http://front:8082/
            SPRING_CLOUD_GATEWAY_ROUTES[3]_PREDICATES[0]: Path=/login,/patient/**,/patients/**,/recherche,/notes/**,/risk/**,/,/css/**
            SPRING_CLOUD_GATEWAY_ROUTES[4]_ID: medilabosolutionapplication-security
            SPRING_CLOUD_GATEWAY_ROUTES[4]_URI: http://security:8087/
            SPRING_CLOUD_GATEWAY_ROUTES[4]_PREDICATES[0]: Path=/auth/**
            SECURITY_SERVICE_URL: http://security:8087/

    patient:
        build: ./medilabosolutionapplication_patient
        networks:
            - medilabosolution
        environment:
            SECURITY_SERVICE_URL: http://security:8087


    front:
        build: ./medilabosolutionapplication_front
        ports:
            - "8082:8082"
        networks:
            - medilabosolution
        environment:
            # Dans Docker, le Front doit appeler la Gateway par son nom de service, pas localhost
            SPRING_CLOUD_OPENFEIGN_CLIENT_GATEWAY_URL: http://gateway:8080
            SPRING_CLOUD_OPENFEIGN_CLIENT_SECURITY_URL: http://security:8087
            #SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/medilabosolution
            #SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/medilabosolution/protocol/openid-connect/certs
    notes:
        build: ./medilabosolutionapplication_notes
        networks:
            - medilabosolution
        environment:
            SECURITY_SERVICE_URL: http://security:8087
    risk:
        build: ./medilabosolutionapplication_risk
        networks:
            - medilabosolution
        environment:
            SECURITY_SERVICE_URL: http://security:8087
            # risk appelle patient et notes directement (bypass gateway, pas de JWT requis)
            SPRING_CLOUD_OPENFEIGN_CLIENT_PATIENT_URL: http://gateway:8080
            SPRING_CLOUD_OPENFEIGN_CLIENT_NOTES_URL: http://gateway:8080
    security:
        build: ./medilabosolutionapplication_security
        ports:
            - "8087:8087"
        networks:
            - medilabosolution
        environment:
            KEYCLOAK_URL_TOKEN: http://keycloak:8080/realms/medilabosolution/protocol/openid-connect/token
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/medilabosolution
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/medilabosolution/protocol/openid-connect/certs
    postgres:
        image: postgres
        volumes:
            - C:/Tools/BDD:/var/lib/postgres/data
        environment:
            POSTGRES_DB: keycloak
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: keycloakkeycloak
        networks:
            - medilabosolution

    keycloak:
        image: quay.io/keycloak/keycloak:26.6.3
        environment:
            DB_VENDOR: POSTGRES
            DB_ADDR: postgres
            DB_DATABASE: keycloak
            DB_USER: keycloak
            DB_PASSWORD: keycloakkeycloak
            DB_SCHEMA: public
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            KEYCLOAK_USER: keycloak
            KEYCLOAK_USER_PASSWORD: keycloakkeycloak
        ports:
            - "8085:8080"
        command:
            - start-dev
        networks:
            - medilabosolution

networks:
    medilabosolution:
        driver: bridge

# docker-compose down ; docker-compose up --build -d
#explications
# docker-compose down : arrete docker compose
#docker-compose up : lance docker compose
# --build force le build
# -d redonne la main lorsque les conteneurs sont lancés 